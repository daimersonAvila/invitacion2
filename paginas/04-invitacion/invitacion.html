<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Invitación - Mis XV Años</title>
  <link
          href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap"
          rel="stylesheet"
  />
  <link rel="stylesheet" href="../../assets/base.css" />
  <link rel="stylesheet" href="../../assets/nav.css" />
  <link rel="stylesheet" href="invitacion.css" />
</head>
<body>
<div id="pageFlip">
  <section class="section bg-gradient-pink-red text-section">

    <!-- ✅ CONTENEDOR DE PÉTALOS BLANCOS CAYENDO -->
    <div id="petalos-container"></div>

    <!-- Flores superiores (esquina) -->
    <img src="../../assets/img/flores1.png" alt="Flores" class="flowers-top" />

    <!-- ✅ CONTENEDOR DEL TEXTO CON LAS 4 MARIPOSAS DEBAJO -->
    <div class="text-wrapper">

      <!-- Texto de dedicatoria -->
      <p class="dedication-text">
        Con la bendición de Dios y el amor que mi familia me ha brindado,
        me siento feliz de haber llegado a este momento de mi vida,
        el día que dejaré atrás mi infancia y comenzaré una nueva etapa.
      </p>

      <!-- ✅ 4 Mariposas DEBAJO del texto -->
      <div class="mariposas-abajo">
        <img src="../../assets/img/mar1.png" alt="Mariposa" class="bfly bfly-abajo bfly-abajo-1" />
        <img src="../../assets/img/mar1.png" alt="Mariposa" class="bfly bfly-abajo bfly-abajo-2" />
        <img src="../../assets/img/mar1.png" alt="Mariposa" class="bfly bfly-abajo bfly-abajo-3" />
        <img src="../../assets/img/mar1.png" alt="Mariposa" class="bfly bfly-abajo bfly-abajo-4" />
      </div>
    </div>

    <!-- Princesa abajo -->
    <img
            src="../../assets/img/princesa.png"
            alt="Princesa"
            class="princess-cutout"
    />
  </section>
</div>

<script src="../../assets/animations.js"></script>
<script src="../../assets/nav.js"></script>
<script src="invitacion.js"></script>
</body>
</html>
